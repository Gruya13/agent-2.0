# Konfiguracija kontrolnog sloja (agentctl).
#
# `adapter: mock` je deterministički zamenik harnesa za testove i demo.
# `adapter: harness` poziva pravi CLI iz tabele HARNESS_COMMANDS:
#   researcher   -> agy  (Google Antigravity / Gemini)
#   verifier     -> dsh  (DeepSeek Harness, headless profil)
#   consolidator -> agy  (Google Antigravity / Gemini)
#   librarian    -> dsh  (DeepSeek Harness, headless profil)
#
# OpenAI Codex je uklonjen iz sistema; vidi docs/PLAN-BEZ-CODEX.md.
#
# Prelazak na prave harnese je izmena isključivo ovog fajla; kod se ne dira.

vault:
  sources: raw
  drafts: wiki/drafts
  production: wiki
  index: wiki/Index.md
  tasks: tasks
  reviews: tasks/reviews
  events: tasks/events.jsonl
  contracts: .agents

lease:
  ttlMs: 600000        # 10 minuta
  heartbeatMs: 120000  # obnova zakupa na 2 minuta

worktree:
  dir: .worktrees
  branchPrefix: agent

pipeline:
  # Red-team faza: posle verifikacije, pre spajanja.
  challenge: true
  # Reprodukcione skripte red-teama izvršava kontrolni sloj u svežem klonu
  # zamrznute revizije. Isključi samo ako ne želiš izvršavanje tuđeg koda.
  challengeExecute: true
  challengeTimeoutMs: 60000
  challengeMaxScripts: 3
  maxRounds: 10
  intervalMs: 0
  agentTimeoutMs: 900000
  maxRevisions: 3

agents:
  researcher:
    adapter: mock
    harness: agy
    model: null
    timeoutMs: 900000
  extractor:
    adapter: mock
    harness: agy
    model: null
    timeoutMs: 300000
  red-team:
    adapter: mock
    harness: dsh
    model: null
    timeoutMs: 900000
  verifier:
    adapter: mock
    harness: dsh
    model: null
    timeoutMs: 900000
  librarian:
    adapter: mock
    harness: dsh
    model: null
    timeoutMs: 900000
  consolidator:
    adapter: mock
    harness: agy
    model: null
    timeoutMs: 900000
  # Coding tok: programer piše popravku, reviewer je DRUGI vendor i pravi
  # sopstveni kontrolni slučaj (nezavisan pregled, zona .agent-review/).
  programer:
    adapter: mock
    harness: dsh
    model: null
    timeoutMs: 900000
  reviewer:
    adapter: mock
    harness: agy
    model: null
    timeoutMs: 900000
