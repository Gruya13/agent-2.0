# Konfiguracija kontrolnog sloja (agentctl).
#
# PRAVI harnesi: researcher/extractor -> agy, verifier/red-team -> dsh,
# consolidator -> agy, librarian -> dsh. OpenAI Codex je uklonjen iz sistema.
#
#   node tools/orchestrator/cli.mjs run --config tools/config/agents.real.yml
#
# Podrazumevana konfiguracija (`agents.yml`) ostaje na `mock`: testovi i demo
# moraju da budu deterministički i besplatni. Ovaj fajl se koristi svesno, po
# pozivu, i troši pravu kvotu.

vault:
  sources: raw
  drafts: wiki/drafts
  production: wiki
  index: wiki/Index.md
  tasks: tasks
  reviews: tasks/reviews
  events: tasks/events.jsonl
  contracts: .agents

lease:
  ttlMs: 600000        # 10 minuta
  heartbeatMs: 120000  # obnova zakupa na 2 minuta

worktree:
  dir: .worktrees
  branchPrefix: agent

pipeline:
  # Red-team faza: posle verifikacije, pre spajanja.
  challenge: true
  # Reprodukcione skripte red-teama izvršava kontrolni sloj u svežem klonu
  # zamrznute revizije. Isključi samo ako ne želiš izvršavanje tuđeg koda.
  challengeExecute: true
  challengeTimeoutMs: 60000
  challengeMaxScripts: 3
  # Red-team reprodukcije se izvršavaju u kontejneru (read-only rootfs, bez
  # mreže, samo klon u /work), ne na hostu. Fallback: bwrap, pa host.
  challengeSandbox: docker
  maxRounds: 10
  intervalMs: 0
  agentTimeoutMs: 900000
  maxRevisions: 3

agents:
  researcher:
    adapter: harness
    harness: agy
    model: null
    timeoutMs: 900000
  extractor:
    adapter: harness
    harness: agy
    model: null
    timeoutMs: 300000
  red-team:
    adapter: harness
    harness: dsh
    model: null
    timeoutMs: 900000
  verifier:
    adapter: harness
    harness: dsh
    model: null
    timeoutMs: 900000
  librarian:
    adapter: harness
    harness: dsh
    model: null
    timeoutMs: 900000
  consolidator:
    adapter: harness
    harness: agy
    model: null
    timeoutMs: 900000
  # Coding tok: programer (dsh) piše popravku i regresioni test, reviewer
  # (agy) je nezavisan vendor i pravi sopstveni kontrolni slučaj.
  programer:
    # Izolovani worker: kod nastaje u kontejneru; host nastavlja kapije.
    adapter: worker
    harness: dsh
    model: deepseek-v4-pro
    timeoutMs: 900000
  # Nezavisan pregled: MORA biti vendor razlicit od autora popravke.
  # Autor je `dsh`, pa je jedini preostali drugi vendor `agy`.
  reviewer:
    adapter: harness
    harness: agy
    model: null
    timeoutMs: 900000
