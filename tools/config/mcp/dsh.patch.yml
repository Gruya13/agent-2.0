# MCP server beleški za DeepSeek Harness (dsh).
#
# Dodaje se u cordis.patch.yml profila (npr. headless) ili se prosleđuje kao
# `dsh --patch ./tools/config/mcp/dsh.patch.yml`.
#
# VAŽNO — šta se NE stavlja ovde:
#   `env` u ovom bloku je statičan i POBIJEĐUJE nasleđeno okruženje
#   (`buildChildEnv` = {...parentEnv, ...config.env}). Zato se `OBSIDIAN_VAULT`,
#   `OBSIDIAN_TASK` i `OBSIDIAN_TASK_ROOT` NE upisuju ovde: kontrolni sloj ih
#   šalje po pozivu, za svako izolovano radno stablo i svaki zadatak.
#   Ako se `OBSIDIAN_VAULT` ne nasledi, server koristi svoj `cwd`, a kontrolni
#   sloj harnes uvek pokreće sa `cwd` = radno stablo zadatka.
#
# Identitet se fiksira ovde jer ne zavisi od zadatka i ne sme da ga nadjača
# slučajna promenljiva iz okruženja.
- insert:
    - id: obsidian-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: obsidian
        command: node
        args:
          - __VAULT__/tools/mcp/obsidian-mcp.mjs
        # OBSIDIAN_ROLE se NE fiksira: statična vrednost pobeđuje nasleđenu
        # (buildChildEnv = {...parentEnv, ...config.env}), pa bi dsh uvek bio
        # "verifier" i red-team ne bi mogao da piše nalaze. Ulogu po zadatku
        # postavlja kontrolni sloj (agentEnv).
        env:
          OBSIDIAN_AGENT: dsh
        toolCallTimeoutMs: 15000
        failOnStartupError: true
